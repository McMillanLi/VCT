[package]
name = "vct"
version = "0.1.0"
description = "VCT - 极简可视化的 FFmpeg 视频转码工具"
authors = ["VCT"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.70"

# 库定义：Tauri v2 推荐使用 lib + main 双文件结构
[lib]
name = "vct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-opener = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时与进程管理
tokio = { version = "1", features = ["full"] }

# 日志
log = "0.4"

[features]
# 默认启用自定义协议
custom-protocol = ["tauri/custom-protocol"]

# Tauri 发布构建优化
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
